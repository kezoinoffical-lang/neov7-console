<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NEOV7 コンソール</title>
<link href="https://cdn.jsdelivr.net/npm/gridjs/dist/theme/mermaid.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/gridjs/dist/gridjs.umd.js"></script>
<style>
  :root{
    --bg:#060a12; --panel:#0f1722; --panel2:#0b121c; --line:#33475f; --text:#e6edf3;
    --label:#8b97a7; --accent:#5b9dff; --shadow:#b98bff; --green:#3fb950; --red:#f85149;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Meiryo",sans-serif;font-size:14px;
    -webkit-text-size-adjust:100%;}
  header{display:flex;flex-wrap:wrap;align-items:stretch;
    background:#05080d;border-bottom:1px solid var(--line);}
  header .brand{padding:12px 20px;flex:0 0 auto;display:flex;flex-direction:column;justify-content:center;}
  header .brand .name{font-size:22px;font-weight:800;color:var(--accent);letter-spacing:1px;line-height:1.1;}
  header .brand .sub{font-size:12px;color:var(--label);margin-top:2px;}
  header .status{flex:1 1 auto;display:grid;grid-template-columns:repeat(5,1fr);}
  header .cell{padding:8px 16px;border-left:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;overflow:hidden;}
  header .cell .l{font-size:11px;color:var(--label);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  header .cell .v{font-size:14px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  header .cell .v.muted{color:var(--label);font-weight:400;}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:14px 16px 4px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;}
  .card h2{margin:0 0 14px;font-size:17px;}
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .kpi{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px 12px;}
  .kpi .l{font-size:12px;color:var(--label);}
  .kpi .v{font-size:22px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums;}
  .kpi .v.muted{color:var(--label);font-size:15px;}
  .kpi .l .best{background:#1a2740;color:#7fb0ff;font-size:10px;padding:1px 6px;border-radius:4px;margin-right:6px;}
  .section{margin:14px 16px 8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;}
  .section .head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);}
  .section .head h2{margin:0;font-size:17px;}
  .section .head .badge{font-size:11px;color:var(--label);}
  .section .body{padding:6px 6px 12px;}
  /* 折りたたみセクション（details/summary） */
  details.fold > summary.head{cursor:pointer;list-style:none;user-select:none;}
  details.fold > summary.head::-webkit-details-marker{display:none;}
  details.fold > summary.head .caret{display:inline-block;margin-right:8px;font-size:12px;color:var(--label);transition:transform .15s;}
  details.fold[open] > summary.head .caret{transform:rotate(90deg);}
  details.fold > summary.head:hover .caret{color:var(--accent);}
  .gridjs-wrapper{overflow-x:auto;-webkit-overflow-scrolling:touch;border-color:#33475f!important;}
  .gridjs-table{font-size:14px;width:100%;table-layout:fixed!important;}
  .gridjs-th,.gridjs-td{border:1px solid #33475f!important;white-space:nowrap;}
  .gridjs-td:last-child,.gridjs-th:last-child{white-space:normal;}
  .gridjs-footer{background:var(--panel2)!important;border-color:#33475f!important;box-shadow:none!important;}
  .gridjs-pagination{color:var(--label)!important}
  .gridjs-pagination .gridjs-pages button{background:var(--panel)!important;color:var(--text)!important;border:1px solid #33475f!important;}
  .gridjs-pagination .gridjs-pages button:disabled{color:var(--label)!important;}
  .gridjs-pagination .gridjs-pages button.gridjs-currentPage{background:#1a2740!important;}
  .bracket{display:grid;grid-template-columns:auto auto;gap:2px 22px;line-height:1.45;white-space:nowrap;font-size:13px;}
  .bracket .u{color:var(--label);font-style:italic;margin-left:3px;font-size:11px;}
  .muted{color:var(--label);}
  .tag{display:inline-block;padding:3px 12px;border-radius:6px;font-size:12px;font-weight:700;}
  .tag.gsbt{background:#12233f;color:#7fb0ff;}
  .tag.shadow{background:#241a3f;color:#b98bff;}
  .empty{padding:18px;color:var(--label);}
  .conn{display:inline-flex;align-items:center;gap:6px;font-size:12px;}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--label);}
  .dot.ok{background:var(--green);} .dot.ng{background:var(--red);} .dot.wait{background:var(--warn,#d29922);}
  @media(max-width:820px){
    .cards{grid-template-columns:1fr;padding:12px 12px 4px;gap:12px;}
    .section{margin:12px 12px 8px;}
    header .brand{padding:14px 16px;flex:1 1 100%;}
    header .status{width:100%;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);}
    header .cell:nth-child(4){border-left:none;}
  }
  @media(max-width:520px){
    body{font-size:13px;}
    .kpis{gap:8px;} .kpi{padding:10px;} .kpi .v{font-size:19px;}
    .gridjs-table{font-size:12px;}
    header .cell{padding:10px 14px;}
    header .brand .name{font-size:21px;}
    .section .head h2,.card h2{font-size:15px;}
  }
</style>
</head>
<body>
<header>
  <div class="brand"><div class="name">NEOV7</div><div class="sub">新GSBT × Shadow FW</div></div>
  <div class="status">
    <div class="cell"><div class="l">米国東部時間</div><div class="v" id="et">—</div></div>
    <div class="cell"><div class="l">市場</div><div class="v" id="market">—</div></div>
    <div class="cell"><div class="l">正本取得</div><div class="v" id="sources">—</div></div>
    <div class="cell"><div class="l">価格</div><div class="v muted" id="price">—</div></div>
    <div class="cell"><div class="l">接続</div><div class="v"><span class="conn"><span class="dot wait" id="dot"></span><span id="connlbl">接続中…</span></span></div></div>
  </div>
</header>
<div class="cards">
  <div class="card"><h2>新GSBT</h2><div class="kpis">
    <div class="kpi"><div class="l">現金</div><div class="v" id="g-cash">受信待ち</div></div>
    <div class="kpi"><div class="l">実現損益</div><div class="v" id="g-realized">受信待ち</div></div>
    <div class="kpi"><div class="l">含み損益</div><div class="v muted" id="g-upnl">未受信</div></div>
    <div class="kpi"><div class="l"><span class="best">最重要</span>勝率</div><div class="v" id="g-win">受信待ち</div></div>
    <div class="kpi"><div class="l">決済件数</div><div class="v" id="g-closed">受信待ち</div></div>
    <div class="kpi"><div class="l">保有件数</div><div class="v" id="g-hold">—</div></div>
  </div></div>
  <div class="card"><h2>Shadow FW</h2><div class="kpis">
    <div class="kpi"><div class="l">現金</div><div class="v" id="s-cash">受信待ち</div></div>
    <div class="kpi"><div class="l">実現損益</div><div class="v" id="s-realized">受信待ち</div></div>
    <div class="kpi"><div class="l">含み損益</div><div class="v muted" id="s-upnl">未受信</div></div>
    <div class="kpi"><div class="l"><span class="best">最重要</span>勝率</div><div class="v" id="s-win">受信待ち</div></div>
    <div class="kpi"><div class="l">決済件数</div><div class="v" id="s-closed">受信待ち</div></div>
    <div class="kpi"><div class="l">保有件数</div><div class="v" id="s-hold">—</div></div>
  </div></div>
</div>
<details class="section fold" id="sig-section"><summary class="head"><h2><span class="caret">▶</span>シグナル発火履歴</h2><span class="badge" id="sig-badge">受信待ち</span></summary><div class="body"><div id="signals"></div></div></details>
<div class="section"><div class="head"><h2>保有銘柄</h2><span class="badge" id="pos-badge">受信待ち</span></div><div class="body"><div id="positions"></div></div></div>
<div class="section"><div class="head"><h2>取引履歴</h2><span class="badge" id="trade-badge">受信待ち</span></div><div class="body"><div id="trades"></div></div></div>
<div class="section"><div class="head"><h2>詳細情報</h2></div><div class="body"><div class="empty" id="detail">接続待ち</div></div></div>
<script>
const SSE_URL = "https://neov7-ec2.tail365d42.ts.net/sidecar/events";
const H = gridjs.html;
const money = v => (v==null||v==="") ? "" : "$"+Number(v).toFixed(2);
const share = (a,b)=>{ if(a==null||b==null||(a+b)<=0) return ""; return Math.round(a/(a+b)*100)+"%"; };
const uju = `<span class="muted">価格未受信</span>`;
function tag(label){const c=label.includes("Shadow")?"shadow":"gsbt";return `<span class="tag ${c}">${label}</span>`;}
function fmtET(iso){ if(!iso) return "—"; try{ const s=new Date(iso).toLocaleString("ja-JP",{timeZone:"America/New_York",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false}); return s+" ET"; }catch(e){ return String(iso); } }
function bracketLive(p){
  const s1=share(p.sl1_qty,p.sl2_qty), s2=share(p.sl2_qty,p.sl1_qty);
  const P=[
    `<span title="${p.sl1}">SL1 ${money(p.sl1)}<span class="u">(${s1})</span></span>`,
    `<span title="${p.sl2}">SL2 ${money(p.sl2)}<span class="u">(${s2})</span></span>`,
    `<span title="${p.tp1}">T1 ${money(p.tp1)}<span class="u">(${s1})</span></span>`,
    `<span title="${p.tp2}">T2 ${money(p.tp2)}<span class="u">(${s2})</span></span>`,
  ];
  return `<div class="bracket">${P.join("")}</div>`;
}
function rowOf(p,label){
  let cur, ptime;
  if (p.mark_available && p.current_price!=null) {
    cur = money(p.current_price);
    ptime = p.price_at_utc ? fmtET(p.price_at_utc) : H(uju);
  } else if (p.prev_close!=null) {
    // 価格が来ていない時は最後に受信した価格を「前回終値」として表示（sidecarが保持・全端末共通）
    cur = H(money(p.prev_close) + ' <span class="u">前回終値</span>');
    ptime = p.prev_close_at ? H(fmtET(p.prev_close_at) + ' <span class="u">前回</span>') : H(uju);
  } else {
    cur = H(uju);
    ptime = H(uju);
  }
  const upnl = (p.unrealized_pnl!=null) ? money(p.unrealized_pnl) : H(uju);
  const uprate = (p.unrealized_pnl_rate!=null) ? (Number(p.unrealized_pnl_rate)*100).toFixed(2)+"%" : H(uju);
  return [
    H(tag(label)),
    H(`<b>${p.symbol}</b> <span class="muted">${p.tf}</span>`),
    p.direction==="short" ? "売建" : "買付",
    p.remaining,
    money(p.entry_price),
    cur, ptime, upnl, uprate,
    H(bracketLive(p)),
  ];
}
