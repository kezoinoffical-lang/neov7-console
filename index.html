<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NEOV7 コンソール</title>
<link href="https://cdn.jsdelivr.net/npm/gridjs/dist/theme/mermaid.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/gridjs/dist/gridjs.umd.js"></script>
<style>
  :root{
    --bg:#060a12; --panel:#0f1722; --panel2:#0b121c; --line:#33475f; --text:#e6edf3;
    --label:#8b97a7; --accent:#5b9dff; --shadow:#b98bff; --green:#3fb950; --red:#f85149;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Meiryo",sans-serif;font-size:14px;
    -webkit-text-size-adjust:100%;}
  header{display:flex;flex-wrap:wrap;align-items:stretch;
    background:#05080d;border-bottom:1px solid var(--line);}
  header .brand{padding:12px 20px;flex:0 0 auto;display:flex;flex-direction:column;justify-content:center;}
  header .brand .name{font-size:22px;font-weight:800;color:var(--accent);letter-spacing:1px;line-height:1.1;}
  header .brand .sub{font-size:12px;color:var(--label);margin-top:2px;}
  header .status{flex:1 1 auto;display:grid;grid-template-columns:repeat(5,1fr);}
  header .cell{padding:8px 16px;border-left:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;overflow:hidden;}
  header .cell .l{font-size:11px;color:var(--label);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  header .cell .v{font-size:14px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  header .cell .v.muted{color:var(--label);font-weight:400;}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:14px 16px 4px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;}
  .card h2{margin:0 0 14px;font-size:17px;}
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .kpi{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px 12px;}
  .kpi .l{font-size:12px;color:var(--label);}
  .kpi .v{font-size:22px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums;}
  .kpi .v.muted{color:var(--label);font-size:18px;}
  .kpi .l .best{background:#1a2740;color:#7fb0ff;font-size:10px;padding:1px 6px;border-radius:4px;margin-right:6px;}
  .section{margin:14px 16px 8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;}
  .section .head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);}
  .section .head h2{margin:0;font-size:17px;}
  .section .body{padding:6px 6px 12px;}
  .gridjs-wrapper{overflow-x:auto;-webkit-overflow-scrolling:touch;border-color:#33475f!important;}
  .gridjs-table{font-size:14px;width:100%;}
  .gridjs-th,.gridjs-td{border:1px solid #33475f!important;}
  .gridjs-footer{background:var(--panel2)!important;border-color:#33475f!important;box-shadow:none!important;}
  .gridjs-pagination{color:var(--label)!important}
  .gridjs-pagination .gridjs-pages button{background:var(--panel)!important;color:var(--text)!important;border:1px solid #33475f!important;}
  .gridjs-pagination .gridjs-pages button:disabled{color:var(--label)!important;}
  .gridjs-pagination .gridjs-pages button.gridjs-currentPage{background:#1a2740!important;}
  .bracket{display:grid;grid-template-columns:1fr 1fr;gap:2px 18px;line-height:1.5;white-space:nowrap;}
  .bracket .u{color:var(--label);font-style:italic;margin-left:4px;font-size:12px;}
  .muted{color:var(--label);}
  .tag{display:inline-block;padding:3px 12px;border-radius:6px;font-size:12px;font-weight:700;}
  .tag.gsbt{background:#12233f;color:#7fb0ff;}
  .tag.shadow{background:#241a3f;color:#b98bff;}
  .empty{padding:18px;color:var(--label);}
  @media(max-width:820px){
    .cards{grid-template-columns:1fr;padding:12px 12px 4px;gap:12px;}
    .section{margin:12px 12px 8px;}
    header .brand{padding:14px 16px;flex:1 1 100%;}
    header .status{width:100%;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);}
    header .cell:nth-child(4){border-left:none;}
  }
  @media(max-width:520px){
    body{font-size:13px;}
    .kpis{gap:8px;}
    .kpi{padding:10px;}
    .kpi .v{font-size:19px;}
    .gridjs-table{font-size:12px;}
    header .cell{padding:10px 14px;}
    header .brand .name{font-size:21px;}
    .section .head h2,.card h2{font-size:15px;}
  }
</style>
</head>
<body>

<header>
  <div class="brand"><div class="name">NEOV7</div><div class="sub">新GSBT × Shadow FW</div></div>
  <div class="status">
    <div class="cell"><div class="l">米国東部時間</div><div class="v" id="et">2026/08/30 07:20 EDT</div></div>
    <div class="cell"><div class="l">市場</div><div class="v" id="market">OVERNIGHT</div></div>
    <div class="cell"><div class="l">正本取得</div><div class="v" id="sources">7 / 7</div></div>
    <div class="cell"><div class="l">価格</div><div class="v muted" id="price">閉場</div></div>
    <div class="cell"><div class="l">最終約定時刻</div><div class="v muted" id="lastfill">未出力</div></div>
  </div>
</header>

<div class="cards">
  <div class="card"><h2>新GSBT</h2><div class="kpis">
    <div class="kpi"><div class="l">現金</div><div class="v">$0.24</div></div>
    <div class="kpi"><div class="l">実現損益</div><div class="v">$0.00</div></div>
    <div class="kpi"><div class="l">含み損益</div><div class="v muted">算出不可</div></div>
    <div class="kpi"><div class="l"><span class="best">最重要</span>勝率</div><div class="v muted">未確定</div></div>
    <div class="kpi"><div class="l">決済件数</div><div class="v">0</div></div>
    <div class="kpi"><div class="l">保有件数</div><div class="v">8</div></div>
  </div></div>
  <div class="card"><h2>Shadow FW</h2><div class="kpis">
    <div class="kpi"><div class="l">現金</div><div class="v">$0.24</div></div>
    <div class="kpi"><div class="l">実現損益</div><div class="v">$0.00</div></div>
    <div class="kpi"><div class="l">含み損益</div><div class="v muted">算出不可</div></div>
    <div class="kpi"><div class="l"><span class="best">最重要</span>勝率</div><div class="v muted">未確定</div></div>
    <div class="kpi"><div class="l">決済件数</div><div class="v">0</div></div>
    <div class="kpi"><div class="l">保有件数</div><div class="v">8</div></div>
  </div></div>
</div>

<div class="section"><div class="head"><h2>シグナル発火履歴</h2></div><div class="body"><div id="signals"></div></div></div>
<div class="section"><div class="head"><h2>保有銘柄</h2></div><div class="body"><div id="positions"></div></div></div>
<div class="section"><div class="head"><h2>取引履歴</h2></div><div class="body"><div id="trades"></div></div></div>
<div class="section"><div class="head"><h2>詳細情報</h2></div><div class="body"><div class="empty" id="detail">未接続（プロトタイプ）</div></div></div>

<script>
const POS = [
  ["新GSBT","AAOI","1h","買付",37,106.34, 102.8905,24, 102.8905,13, 108.7076, 112.3818],
  ["Shadow FW","AAOI","1h","買付",37,106.34, 102.8905,24, 102.8905,13, 108.7076, 112.3818],
  ["新GSBT","APLD","1h","買付",156,25.49, 24.8205,104, 24.8205,52, 26.2211, 26.7378],
  ["Shadow FW","APLD","1h","買付",156,25.49, 24.8205,104, 24.8205,52, 26.2211, 26.7378],
  ["新GSBT","AXTI","1h","買付",67,59.25, 56.6521,44, 56.6521,23, 60.4370, 63.0462],
  ["Shadow FW","AXTI","1h","買付",67,59.25, 56.6521,44, 56.6521,23, 60.4370, 63.0462],
  ["新GSBT","HTZ","30m","売建",2,2.14, 2.2132,1, 2.2132,1, 2.0757, 2.0383],
  ["Shadow FW","HTZ","30m","売建",2,2.14, 2.2132,1, 2.2132,1, 2.0757, 2.0383],
  ["新GSBT","MARA","1h","買付",373,10.71, 10.26,249, 10.26,124, 11.0391, 11.2076],
  ["Shadow FW","MARA","1h","買付",373,10.71, 10.26,249, 10.26,124, 11.0391, 11.2076],
  ["新GSBT","OPEN","30m","買付",4,3.30, 3.1261,2, 3.1261,2, 3.4287, 3.5429],
  ["Shadow FW","OPEN","30m","買付",4,3.30, 3.1261,2, 3.1261,2, 3.4287, 3.5429],
  ["新GSBT","PL","30m","買付",6,20.07, 19.1281,3, 19.1281,3, 21.1562, 21.6338],
  ["Shadow FW","PL","30m","買付",6,20.07, 19.1281,3, 19.1281,3, 21.1562, 21.6338],
  ["新GSBT","PURR","1h","買付",338,11.80, 11.4171,223, 11.4171,115, 12.1113, 12.4493],
  ["Shadow FW","PURR","1h","買付",338,11.80, 11.4171,223, 11.4171,115, 12.1113, 12.4493],
];
const SIGNALS = [
  ["新GSBT","PURR","30m","買付"],["Shadow FW","PURR","30m","買付"],
  ["新GSBT","SEDG","30m","買付"],["Shadow FW","SEDG","30m","買付"],
  ["新GSBT","WGS","30m","売建"],["Shadow FW","WGS","30m","売建"],
];

const money = v => v==null ? "" : "$"+Number(v).toFixed(2);
const share = (a,b)=>{ if(a==null||b==null||(a+b)<=0) return ""; return Math.round(a/(a+b)*100)+"%"; };
const H = gridjs.html;
const un = `<span class="muted">未出力</span>`, uju = `<span class="muted">価格未受信</span>`;
function tag(side){const c=side.includes("Shadow")?"shadow":"gsbt";return `<span class="tag ${c}">${side}</span>`;}

// 2OCOは必ずSL1/SL2/T1/T2の4本が揃う。常に4本表示（欠落表示はしない）。配分%はqtyから、画面計算はこの表示のみ
function bracket(r){
  const [,,,,,,sl1,sl1q,sl2,sl2q,tp1,tp2]=r;
  const s1=share(sl1q,sl2q), s2=share(sl2q,sl1q);
  const P=[
    `<span title="${sl1}">SL1 ${money(sl1)}<span class="u">(${s1})</span></span>`,
    `<span title="${sl2}">SL2 ${money(sl2)}<span class="u">(${s2})</span></span>`,
    `<span title="${tp1}">T1 ${money(tp1)}<span class="u">(${s1})</span></span>`,
    `<span title="${tp2}">T2 ${money(tp2)}<span class="u">(${s2})</span></span>`,
  ];
  return `<div class="bracket">${P.join("")}</div>`;
}

const th={background:"#0b121c",color:"#8b97a7",borderColor:"#33475f",fontSize:"13px"};
const td={background:"#0f1722",color:"#e6edf3",borderColor:"#33475f",verticalAlign:"top"};

new gridjs.Grid({
  columns:["系統","銘柄","時間足","方向","シグナル","価格","発火時刻（ET）","状態"],
  data:SIGNALS.map(s=>[H(tag(s[0])),s[1],s[2],s[3],H(un),H(un),H(un),H(un)]),
  pagination:{limit:8}, style:{table:{width:"100%"},th,td},
}).render(document.getElementById("signals"));

new gridjs.Grid({
  columns:["系統","銘柄","売買","残数量","取得価格","現在値","価格時刻（ET）","含み損益","含み損益率","損切／利確"],
  data:POS.map(r=>{const[side,sym,tf,dir,qty,entry]=r;return[
    H(tag(side)), H(`<b>${sym}</b> <span class="muted">${tf}</span>`), dir, qty, money(entry),
    H(uju), H(uju), H(uju), H(uju), H(bracket(r)) ];}),
  pagination:{limit:8}, style:{table:{width:"100%"},th,td},
}).render(document.getElementById("positions"));

new gridjs.Grid({
  columns:["系統","銘柄","売買","数量","取得価格","決済価格","実現損益","損益率","決済理由","決済時刻（ET）"],
  data:[], style:{table:{width:"100%"},th,td},
  language:{noRecordsFound:"決済履歴なし"},
}).render(document.getElementById("trades"));
</script>
</body>
</html>
