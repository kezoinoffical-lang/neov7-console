<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEOV7 コンソール</title>
<link href="https://cdn.jsdelivr.net/npm/gridjs/dist/theme/mermaid.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/gridjs/dist/gridjs.umd.js"></script>
<style>
  :root{
    --bg:#0a0e14; --panel:#111823; --line:#1e2a3a; --text:#e6edf3;
    --label:#8b97a7; --accent:#5b9dff; --shadow:#a97bff;
    --green:#3fb950; --red:#f85149;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Meiryo",sans-serif;}
  header{display:flex;flex-wrap:wrap;align-items:center;gap:24px;
    padding:16px 20px;background:#05080d;border-bottom:1px solid var(--line);}
  header .title{font-size:22px;font-weight:800;color:var(--accent);}
  header .title small{display:block;font-size:12px;color:var(--label);font-weight:400;}
  header .stat{font-size:13px;color:var(--label);}
  header .stat b{display:block;font-size:15px;color:var(--text);font-weight:700;}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:16px 20px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;}
  .card h2{margin:0 0 12px;font-size:16px;}
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .kpi{background:#0d1520;border:1px solid var(--line);border-radius:8px;padding:10px 12px;}
  .kpi .l{font-size:12px;color:var(--label);}
  .kpi .v{font-size:20px;font-weight:700;margin-top:4px;}
  .section{padding:8px 20px 28px;}
  .section h2{font-size:16px;margin:16px 0 10px;}
  .bracket{display:grid;grid-template-columns:1fr 1fr;gap:2px 18px;line-height:1.5;white-space:nowrap;}
  .bracket .u{color:var(--label);font-style:italic;margin-left:4px;font-size:12px;}
  .muted{color:var(--label);}
  .tag{display:inline-block;padding:3px 10px;border-radius:6px;font-size:12px;font-weight:700;}
  .tag.gsbt{background:#12233f;color:#7fb0ff;}
  .tag.shadow{background:#241a3f;color:#b98bff;}
  .gridjs-table{font-size:14px;}
  @media(max-width:760px){.cards{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>

<header>
  <div class="title">NEOV7<small>新GSBT × Shadow FW</small></div>
  <div class="stat">米国東部時間<b id="et">2026/08/30 05:36 EDT</b></div>
  <div class="stat">市場<b id="market">OVERNIGHT</b></div>
  <div class="stat">正本取得<b id="sources">7 / 7</b></div>
  <div class="stat">価格<b id="price-state" class="muted">閉場</b></div>
</header>

<div class="cards">
  <div class="card">
    <h2>新GSBT</h2>
    <div class="kpis">
      <div class="kpi"><div class="l">現金</div><div class="v">$0.24</div></div>
      <div class="kpi"><div class="l">実現損益</div><div class="v">$0.00</div></div>
      <div class="kpi"><div class="l">含み損益</div><div class="v muted">算出不可</div></div>
      <div class="kpi"><div class="l">勝率</div><div class="v muted">未確定</div></div>
      <div class="kpi"><div class="l">決済件数</div><div class="v">0</div></div>
      <div class="kpi"><div class="l">保有件数</div><div class="v">8</div></div>
    </div>
  </div>
  <div class="card">
    <h2>Shadow FW</h2>
    <div class="kpis">
      <div class="kpi"><div class="l">現金</div><div class="v">$0.24</div></div>
      <div class="kpi"><div class="l">実現損益</div><div class="v">$0.00</div></div>
      <div class="kpi"><div class="l">含み損益</div><div class="v muted">算出不可</div></div>
      <div class="kpi"><div class="l">勝率</div><div class="v muted">未確定</div></div>
      <div class="kpi"><div class="l">決済件数</div><div class="v">0</div></div>
      <div class="kpi"><div class="l">保有件数</div><div class="v">8</div></div>
    </div>
  </div>
</div>

<div class="section">
  <h2>保有銘柄</h2>
  <div id="positions"></div>
</div>

<script>
const SAMPLE = [
  ["新GSBT","AAOI","1h","買付",37,106.34, 102.8905,24, 102.8905,13, 108.7076, 112.3818],
  ["Shadow FW","AAOI","1h","買付",37,106.34, 102.8905,24, 102.8905,13, 108.7076, 112.3818],
  ["新GSBT","APLD","1h","買付",156,25.49, 24.8205,104, 24.8205,52, 26.2211, 26.7378],
  ["Shadow FW","APLD","1h","買付",156,25.49, 24.8205,104, 24.8205,52, 26.2211, 26.7378],
  ["新GSBT","AXTI","1h","買付",67,59.25, 56.6521,44, 56.6521,23, 60.4370, 63.0462],
  ["Shadow FW","AXTI","1h","買付",67,59.25, 56.6521,44, 56.6521,23, 60.4370, 63.0462],
  ["新GSBT","HTZ","30m","売建",1,2.14, null,0, 2.2132,1, null, 2.0383],
  ["Shadow FW","HTZ","30m","売建",1,2.14, null,0, 2.2132,1, null, 2.0383],
  ["新GSBT","MARA","1h","買付",373,10.71, 10.26,249, 10.26,124, 11.0391, 11.2076],
  ["Shadow FW","MARA","1h","買付",373,10.71, 10.26,249, 10.26,124, 11.0391, 11.2076],
  ["新GSBT","OPEN","30m","買付",4,3.30, 3.1261,2, 3.1261,2, 3.4287, 3.5429],
  ["Shadow FW","OPEN","30m","買付",4,3.30, 3.1261,2, 3.1261,2, 3.4287, 3.5429],
  ["新GSBT","PL","30m","買付",6,20.07, 19.1281,3, 19.1281,3, 21.1562, 21.6338],
  ["Shadow FW","PL","30m","買付",6,20.07, 19.1281,3, 19.1281,3, 21.1562, 21.6338],
  ["新GSBT","PURR","1h","買付",338,11.80, 11.4171,223, 11.4171,115, 12.1113, 12.4493],
  ["Shadow FW","PURR","1h","買付",338,11.80, 11.4171,223, 11.4171,115, 12.1113, 12.4493],
];

const money = v => v==null ? "" : "$"+Number(v).toFixed(2);
const share = (a,b)=>{ if(a==null||b==null||(a+b)<=0) return ""; return Math.round(a/(a+b)*100)+"%"; };

function bracketCell(r){
  const [ , , , , , , sl1, sl1q, sl2, sl2q, tp1, tp2] = r;
  const s1 = share(sl1q, sl2q), s2 = share(sl2q, sl1q);
  const hasFirst  = sl1q>0;
  const hasSecond = sl2q>0;
  const parts = [];
  parts.push(hasFirst  ? `<span title="${sl1}">SL1 ${money(sl1)}<span class="u">(${s1})</span></span>` : `<span></span>`);
  parts.push(hasSecond ? `<span title="${sl2}">SL2 ${money(sl2)}<span class="u">(${s2})</span></span>` : `<span></span>`);
  parts.push(hasFirst  && tp1!=null ? `<span title="${tp1}">T1 ${money(tp1)}<span class="u">(${s1})</span></span>` : `<span></span>`);
  parts.push(hasSecond && tp2!=null ? `<span title="${tp2}">T2 ${money(tp2)}<span class="u">(${s2})</span></span>` : `<span></span>`);
  return `<div class="bracket">${parts.join("")}</div>`;
}

function tagCell(side){
  const cls = side.includes("Shadow") ? "shadow" : "gsbt";
  return `<span class="tag ${cls}">${side}</span>`;
}

const rows = SAMPLE.map(r=>{
  const [side,symbol,tf,dir,qty,entry] = r;
  return [
    gridjs.html(tagCell(side)),
    gridjs.html(`<b>${symbol}</b> <span class="muted">${tf}</span>`),
    dir,
    qty,
    money(entry),
    gridjs.html(`<span class="muted">価格未受信</span>`),
    gridjs.html(`<span class="muted">価格未受信</span>`),
    gridjs.html(bracketCell(r)),
  ];
});

new gridjs.Grid({
  columns: ["系統","銘柄","売買","残数量","取得価格","現在値","含み損益","損切／利確"],
  data: rows,
  sort: true,
  search: true,
  style: {
    table:{width:"100%"},
    th:{background:"#0d1520",color:"#8b97a7",borderColor:"#1e2a3a",fontSize:"13px"},
    td:{background:"#111823",color:"#e6edf3",borderColor:"#1e2a3a",verticalAlign:"top"},
  }
}).render(document.getElementById("positions"));
</script>
</body>
</html>
